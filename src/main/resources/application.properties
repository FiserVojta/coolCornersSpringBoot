
spring.datasource.url=jdbc:postgresql://localhost:5532/cornersdev
#spring.jpa.properties.hibernate.default_schema=corners-dev
spring.datasource.username=dbadmin
spring.datasource.password=coolcorners123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none


server.servlet.context-path=/api

# Multipart upload limits (default is 1MB per field, which is too small for image uploads)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


#keycloak
# === Keycloak JWT issuer ===
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://coolcorners.org/keycloak/realms/cool-corners
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://coolcorners.org/keycloak/realms/cool-corners/protocol/openid-connect/certs


# (Optional) Logging for debugging
logging.level.org.springframework.security=INFO

digitalocean.spaces.access-key=${S3_ACCESS_KEY}
digitalocean.spaces.secret-key=${S3_KEY}
# Scaleway Object Storage (local). Prod overrides region/endpoint/bucket via k8s env vars.
digitalocean.spaces.region=fr-par
digitalocean.spaces.bucket=cornersdev
digitalocean.spaces.endpoint=https://s3.fr-par.scw.cloud
# Upload objects with a public-read ACL so they're downloadable anonymously (matches prod default).
digitalocean.spaces.public-read-acl=true
