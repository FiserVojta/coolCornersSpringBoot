version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: corners-postgres
    environment:
      POSTGRES_DB: cornersdev
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: coolcorners123
    ports:
      - "5532:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d cornersdev"]
      interval: 10s
      timeout: 5s
      retries: 5

  service:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: corners-app
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cornersdev
      SPRING_DATASOURCE_USERNAME: dbadmin
      SPRING_DATASOURCE_PASSWORD: coolcorners123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SERVER_SERVLET_CONTEXT_PATH: /api
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
